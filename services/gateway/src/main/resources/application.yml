spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    # Spring Cloud 2025.1 targets Boot 4.0; this app is tested on Boot 4.1 in CI.
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: ${AUTH_URI:http://localhost:8082}
              predicates:
                - Path=/v1/auth/**,/v1/admin/users/**,/.well-known/jwks.json
            - id: catalog
              uri: ${CATALOG_URI:http://localhost:8083}
              predicates:
                - Path=/v1/catalog/**,/v1/admin/catalog/**
            - id: pricing
              uri: ${PRICING_URI:http://localhost:8084}
              predicates:
                - Path=/v1/places/**,/v1/quotes/**
            - id: booking
              uri: ${BOOKING_URI:http://localhost:8085}
              predicates:
                - Path=/v1/bookings/**,/v1/admin/bookings/**
            - id: payment
              uri: ${PAYMENT_URI:http://localhost:8086}
              predicates:
                - Path=/v1/payments/**

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}   # "native" behind a trusted proxy (the tunnel)

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

booking:
  gateway:
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Requests per minute per client IP.
      default-per-minute: 300
      sign-in-per-minute: 10          # /v1/auth/login, /register, /refresh: slows password guessing
