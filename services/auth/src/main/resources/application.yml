spring:
  application:
    name: auth
  config:
    import: classpath:booking-platform.yml

booking:
  platform:
    security:
      public-paths:
        - /v1/auth/register
        - /v1/auth/login
        - /v1/auth/refresh
        - /v1/auth/logout
        - /.well-known/jwks.json
  auth:
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    # base64 of a P-256 private key PEM followed by its public key PEM; see .env.demo.example.
    # Empty = a throwaway key per start (local only: every restart signs everyone out).
    signing-key-b64: ${AUTH_JWT_PRIVATE_KEY_B64:}
    require-signing-key: false
    seed-admin:
      email: ${AUTH_SEED_ADMIN_EMAIL:admin@local.test}
      password: ${AUTH_SEED_ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: demo
booking:
  auth:
    require-signing-key: true
