# Free CI: GitHub-hosted runners only, no paid services, no deploy secrets.
name: CI

# Every push runs CI, so feature branches are checked before a pull request is opened;
# pull requests from branches in this repo show those same checks.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Spring Boot services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Detect Gradle build
        id: detect
        # Steps below are skipped until the first service lands under ./services.
        run: echo "present=$([ -f services/settings.gradle.kts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
      - if: steps.detect.outputs.present == 'true'
        name: Build and test (Testcontainers uses the runner's Docker)
        working-directory: services
        run: ./gradlew --no-daemon build 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - if: always() && steps.detect.outputs.present == 'true'
        name: Report test totals and build errors as annotations
        run: python3 .github/scripts/annotate_gradle.py "$RUNNER_TEMP/gradle.log" "$GITHUB_WORKSPACE/services"

  infra:
    name: Compose and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate every Compose profile
        run: |
          for profiles in infra infra,apps infra,apps,tunnel,stripe; do
            COMPOSE_PROFILES=$profiles docker compose --env-file .env.example config --quiet
          done
          docker compose --env-file .env.demo.example config --quiet
      - name: ShellCheck
        run: shellcheck scripts/*.sh infra/postgres/init/*.sh
      - name: No Stripe keys or webhook secrets anywhere in the repository
        run: |
          if git grep -nE '(sk|rk)_(test|live)_[A-Za-z0-9]{30,}|whsec_[A-Za-z0-9]{30,}' -- . ; then
            echo "Remove the Stripe key above and roll it in the Stripe Dashboard" >&2
            exit 1
          fi
      - name: Env files have no comments after empty values (Compose reads them as the value)
        run: |
          if grep -nE '^[A-Z0-9_]+=[[:space:]]+#' .env.example .env.demo.example; then
            echo "Put the comment on its own line above the variable" >&2
            exit 1
          fi
      - name: No secrets in example env files
        run: |
          if grep -nE '^(STRIPE_PAYMENTS_API_KEY|STRIPE_CONNECT_API_KEY|STRIPE_CLI_API_KEY|STRIPE_WEBHOOK_SECRET|FCM_SERVICE_ACCOUNT_B64|AUTH_JWT_PRIVATE_KEY_B64|SMTP_PASSWORD)=[^[:space:]#]' .env.example .env.demo.example; then
            echo "Example env files must not contain real secret values" >&2
            exit 1
          fi
